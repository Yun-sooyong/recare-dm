{% load static %}
{# TODO: base.html 완성 시 extends 로 전환. 현재 자립형. #}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환자 삭제</title>
  <link rel="stylesheet" href="{% static 'css/patients.css' %}">
</head>
<body>
  <header class="page-header">
    <h1>환자 삭제</h1>
    <div class="subtitle">삭제 전 확인</div>
  </header>

  <main class="page-body">
    <div class="content-card form-card">
      <p class="warn-text">
        환자코드 <strong>{{ patient.patient_nbr }}</strong> 을(를) 삭제하시겠습니까?<br>
        이 환자에 연결된 내원(PredictionData) <strong>{{ n_visits }}건</strong>도 함께 삭제됩니다(CASCADE).<br>
        이 작업은 되돌릴 수 없습니다.
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="form-actions">
          <button class="btn btn-danger" type="submit">삭제</button>
          <a class="btn btn-ghost" href="{% url 'patients:patient_list' %}">취소</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
